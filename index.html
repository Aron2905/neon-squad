<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#172b49"><title>Neon Squad 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14203b;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 7px #102039;font-size:16px}#cp{position:fixed;top:55px;left:50%;transform:translateX(-50%);background:#153b43bb;border:1px solid #72ffdb;border-radius:12px;padding:7px 13px;display:none;font-size:13px;font-weight:800}#menu{position:fixed;inset:0;background:#07152acb;display:grid;place-items:center;padding:18px}#panel{width:min(370px,100%);padding:25px;background:linear-gradient(145deg,#203e63,#14243f);border:1px solid #6895bc;border-radius:22px;text-align:center;box-shadow:0 15px 55px #071222aa}h1{margin:0 0 12px;color:#75f5ff;font-size:32px}p{line-height:1.5;color:#e6f4ff}button{display:block;width:100%;margin:10px 0;border:0;border-radius:14px;padding:14px 12px;font-weight:900;font-size:17px;color:white;background:linear-gradient(120deg,#00c7e8,#646cff)}button.alt{background:#405c80}small{color:#bdd1e5}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="stats">👥 5　🔫 Lv.1</span><span id="meters">0 m</span></div><div id="cp">💾 CHECKPOINT GESPEICHERT</div><div id="menu"><div id="panel"><h1>NEON SQUAD: CITY RUN</h1><p id="msg">Führe deine Truppe durch die Tore, sammle Waffen-Upgrades und bekämpfe Zombies, Mutanten und riesige Bosse!</p><div id="buttons"></div><small>Mit dem Finger nach links/rechts steuern · offline spielbar</small></div></div><script>
'use strict';
const canvas=document.getElementById('game'),g=canvas.getContext('2d'),menu=document.getElementById('menu'),buttons=document.getElementById('buttons'),msg=document.getElementById('msg'),stats=document.getElementById('stats'),meters=document.getElementById('meters'),cpEl=document.getElementById('cp');
let W=390,H=800,dpr=1,now=0,last=0,active=false,drag=false,dragX=0,playerX=0,soldiers=5,gun=1,distance=0,fire=0,spawn=0,objects=[],shots=[],fx=[],nextCP=280,cpTimer=0,inv=0,step=0,checkpoint=null;
try{checkpoint=JSON.parse(localStorage.getItem('neon_squad_3d_v2_checkpoint')||'null')}catch(e){}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function start(cp){active=true;menu.style.display='none';playerX=0;soldiers=cp?.soldiers??5;gun=cp?.gun??1;distance=cp?.distance??0;fire=0;spawn=0;objects=[];shots=[];fx=[];nextCP=distance+rnd(210,330);cpTimer=0;inv=0;step=0;last=performance.now()}
function button(label,fn,alt=false){let b=document.createElement('button');b.textContent=label;b.className=alt?'alt':'';b.onclick=fn;buttons.appendChild(b)}
function screen(title,body){active=false;menu.style.display='grid';document.querySelector('h1').textContent=title;msg.innerHTML=body;buttons.innerHTML='';button('▶ Neues Spiel',()=>start(null));if(checkpoint)button('💾 Checkpoint: '+checkpoint.distance+' m',()=>start(checkpoint),true)}
screen('NEON SQUAD: CITY RUN','Kamera hinter deiner Truppe, echte perspektivische Tiefe, unterschiedliche Zombies, Mutanten und Monster.');
// World coordinates: x across the road, z ahead, y upward. Camera sits behind the squad and looks forward/down.
function project(x,y,z){let zz=Math.max(1,z+5);let k=Math.min(W*1.6,H*.95)/zz;return {x:W/2+x*k,y:H*.24+H*3.8/zz-y*k,z:zz,k}}
function poly(pts,color){g.fillStyle=color;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fill()}
function line(a,b,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);g.fill()}
function box(x,y,z,w,h,d,front,side,top){let a=project(x-w/2,y,z-d/2),b=project(x+w/2,y,z-d/2),c=project(x+w/2,y+h,z-d/2),e=project(x-w/2,y+h,z-d/2),f=project(x-w/2,y,z+d/2),i=project(x+w/2,y,z+d/2),j=project(x+w/2,y+h,z+d/2),k=project(x-w/2,y+h,z+d/2);poly([f,i,b,a],side);poly([e,c,j,k],top);poly([a,b,c,e],front);poly([b,i,j,c],side)}
function sphere(x,y,z,r,color,highlight){let p=project(x,y,z);ellipse(p.x,p.y,r*p.k,r*p.k*.98,color);if(highlight)ellipse(p.x-r*p.k*.25,p.y-r*p.k*.25,r*p.k*.34,r*p.k*.25,highlight)}
function shadow(x,z,r){let p=project(x,.01,z);ellipse(p.x,p.y,r*p.k,.24*r*p.k,'#101f35a8')}
function soldier(x,z,phase,scale=1){let bob=Math.sin(step*12+phase)*.09;shadow(x,z,.36*scale);let leg=Math.sin(step*12+phase)*.22;box(x-.13*scale,.08,z+leg,.19*scale,.52*scale,.19*scale,'#243d67','#1a2c4d','#365e8d');box(x+.13*scale,.08,z-leg,.19*scale,.52*scale,.19*scale,'#243d67','#1a2c4d','#365e8d');box(x,.56+bob,z,.57*scale,.7*scale,.34*scale,'#ecf4fc','#b3d2e7','#fff');box(x-.39*scale,.66+bob,z,.19*scale,.53*scale,.21*scale,'#e4c09c','#b58a6c','#ffdfb2');box(x+.39*scale,.66+bob,z,.19*scale,.53*scale,.21*scale,'#e4c09c','#b58a6c','#ffdfb2');box(x,.75+bob,z-.28*scale,.45*scale,.58*scale,.23*scale,'#927246','#5e4a35','#bd995c');sphere(x,1.53+bob,z,.27*scale,'#e9b88e','#ffe1ba');sphere(x,1.67+bob,z,.32*scale,'#1676d5','#5abfff');box(x+.19*scale,.91+bob,z+.38*scale,.16*scale,.15*scale,.75*scale,'#263348','#111d30','#475b76');if(active&&Math.sin(step*26+phase)>0.78){let muzzle=project(x+.2*scale,1.1+bob,z+1.15*scale);ellipse(muzzle.x,muzzle.y,Math.max(3,muzzle.k*.13),Math.max(3,muzzle.k*.13),'#ffdf55')}}
function zombie(o){let {x,z,type}=o;let s=type==='boss'?3.2:type==='brute'?1.9:type==='monster'?2.3:1;let t=step*7+o.seed,bob=Math.sin(t)*.08;shadow(x,z,.55*s);let skin=type==='monster'?'#9b60e0':type==='boss'?'#7d9f42':type==='brute'?'#66a16c':'#6ec48d';let dark=type==='monster'?'#573a8b':'#3d795b';box(x-.17*s,.05,z+Math.sin(t)*.13*s,.28*s,.69*s,.29*s,'#374154','#293244','#596274');box(x+.17*s,.05,z-Math.sin(t)*.13*s,.28*s,.69*s,.29*s,'#374154','#293244','#596274');box(x,.7*s+bob,z,.8*s,.85*s,.48*s,type==='boss'?'#7e3153':type==='monster'?'#46316e':'#8a4e63','#623349','#b46a7c');box(x-.54*s,1*s+bob,z+.17*s,.25*s,.74*s,.28*s,skin,dark,skin);box(x+.54*s,1*s+bob,z+.17*s,.25*s,.74*s,.28*s,skin,dark,skin);sphere(x,1.78*s+bob,z,.38*s,skin,'#c1f8b7');let p=project(x,1.8*s+bob,z);ellipse(p.x-.14*s*p.k,p.y,.065*s*p.k,.07*s*p.k,'#f53b5d');ellipse(p.x+.14*s*p.k,p.y,.065*s*p.k,.07*s*p.k,'#f53b5d');if(type==='monster'){sphere(x-.52*s,2.2*s,z,.19*s,'#b678f5');sphere(x+.52*s,2.2*s,z,.19*s,'#b678f5')}if(type==='boss'){box(x,2.4*s,z,.25*s,.32*s,.25*s,'#d8ad68','#aa7241','#ffe09b')}let q=project(x,2.4*s,z);let ww=clamp(s*q.k*1.1,25,160);g.fillStyle='#3d243b';g.fillRect(q.x-ww/2,q.y-10,ww,6);g.fillStyle=type==='boss'?'#ff466b':'#8efc79';g.fillRect(q.x-ww/2,q.y-10,ww*clamp(o.hp/o.max,0,1),6)}
function gate(o){let p=project(o.x,0,o.z),top=project(o.x,2.5,o.z),wide=1.3*p.k,col=o.value>0?'#5bffca':'#ff688c';g.save();g.shadowColor=col;g.shadowBlur=14;line({x:p.x-wide/2,y:p.y}, {x:top.x-wide/2,y:top.y},col,Math.max(4,p.k*.13));line({x:p.x+wide/2,y:p.y},{x:top.x+wide/2,y:top.y},col,Math.max(4,p.k*.13));line({x:top.x-wide/2,y:top.y},{x:top.x+wide/2,y:top.y},col,Math.max(5,p.k*.14));g.restore();g.fillStyle='#fff';g.textAlign='center';g.font=`900 ${clamp(p.k*.55,12,35)}px system-ui`;g.fillText(o.kind==='upgrade'?'🔫 +1':(o.value>0?'+':'')+o.value,p.x,(top.y+p.y)/2)}
function spawnObject(){let roll=Math.random(),x=rnd(-3.2,3.2),z=rnd(70,85);if(roll<.58){let type=roll<.28?'normal':roll<.40?'brute':roll<.50?'monster':'boss';let hp=Math.round((type==='normal'?5:type==='brute'?20:type==='monster'?38:95)*(1+distance/1000));objects.push({kind:'enemy',type,x,z,hp,max:hp,speed:type==='boss'?5:type==='brute'?7:9,seed:Math.random()*10,damage:type==='boss'?7:type==='monster'?4:type==='brute'?3:1})}else if(roll<.91){let value=Math.random()<.78?Math.ceil(rnd(2,9)):-Math.ceil(rnd(1,5));objects.push({kind:'gate',x,z,value})}else objects.push({kind:'upgrade',x,z,value:1})}
function save(){checkpoint={distance:Math.floor(distance),soldiers,gun};try{localStorage.setItem('neon_squad_3d_v2_checkpoint',JSON.stringify(checkpoint))}catch(e){}cpTimer=2.5;burst(playerX,6,'#78ffe0',25)}
function burst(x,z,color,n){for(let i=0;i<n;i++)fx.push({x,z,y:rnd(.3,2),vx:rnd(-2.5,2.5),vz:rnd(-2,2),vy:rnd(.2,3),life:rnd(.2,.7),color})}
function update(dt){if(!active)return;step+=dt;distance+=dt*10;cpTimer=Math.max(0,cpTimer-dt);cpEl.style.display=cpTimer>0?'block':'none';inv=Math.max(0,inv-dt);if(drag)playerX+=clamp(dragX-playerX,-12*dt,12*dt);playerX=clamp(playerX,-3.4,3.4);spawn-=dt;if(spawn<=0){spawnObject();spawn=rnd(.8,1.45)*clamp(1-distance/5000,.45,1)}if(distance>=nextCP){save();nextCP=distance+rnd(210,370)}
for(let o of objects){o.z-=(o.kind==='enemy'?o.speed:10)*dt;if(o.kind==='enemy'&&o.z<35){o.x+=clamp(playerX-o.x,-.8*dt,.8*dt)}}
fire-=dt;if(fire<=0){let target=objects.filter(o=>o.kind==='enemy'&&o.z>4&&o.z<55).sort((a,b)=>a.z-b.z)[0];if(target){let power=Math.min(6,gun)*Math.max(1,Math.ceil(soldiers/5));target.hp-=power;shots.push({x:playerX,z:2,tx:target.x,tz:target.z,life:.13});if(target.hp<=0){burst(target.x,target.z,'#ffb76b',14);objects.splice(objects.indexOf(target),1)}}fire=.19/Math.sqrt(gun)}
for(let i=objects.length-1;i>=0;i--){let o=objects[i];if(o.z>2.5||o.z<-.5)continue;if(Math.abs(o.x-playerX)<(o.kind==='enemy'?(o.type==='boss'?2.3:1.1):1.35)){if(o.kind==='enemy'){if(inv<=0){soldiers=Math.max(0,soldiers-o.damage);inv=.55;burst(o.x,2,'#ff6688',12)}}else if(o.kind==='upgrade'){gun=Math.min(15,gun+1);burst(o.x,2,'#ffe16b',16)}else{soldiers=clamp(soldiers+o.value,1,70);burst(o.x,2,o.value>0?'#72ffcb':'#ff6688',16)}objects.splice(i,1)}else if(o.z<-.5)objects.splice(i,1)}
for(let i=shots.length-1;i>=0;i--){shots[i].life-=dt;if(shots[i].life<=0)shots.splice(i,1)}for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.x+=f.vx*dt;f.z+=f.vz*dt;f.y+=f.vy*dt;f.vy-=7*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1)}
if(soldiers<=0)screen('💀 GAME OVER',`Du hast <b>${Math.floor(distance)} Meter</b> überlebt. Wähle einen Neustart oder deinen gespeicherten Checkpoint.`);stats.textContent=`👥 ${soldiers}　🔫 Lv.${gun}`;meters.textContent=`🏁 ${Math.floor(distance)} m`}
function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#4084cf');sky.addColorStop(.28,'#a5d9fa');sky.addColorStop(.43,'#d1e5e5');sky.addColorStop(1,'#8c9e9c');g.fillStyle=sky;g.fillRect(0,0,W,H);
// Ground, road and perspective lane markers
let far=project(0,0,110),near=project(0,0,.1);poly([project(-5,0,110),project(5,0,110),project(5,0,-3.5),project(-5,0,-3.5)],'#404c5e');poly([project(-4.8,.02,110),project(-4.8,.02,-3.5),project(-4.65,.02,-3.5),project(-4.65,.02,110)],'#e8e1b7');poly([project(4.65,.02,110),project(4.65,.02,-3.5),project(4.8,.02,-3.5),project(4.8,.02,110)],'#e8e1b7');let offset=(distance*1.2)%12;for(let z=110-offset;z>0;z-=12){for(let x of [-1.55,1.55]){poly([project(x-.045,.04,z),project(x+.045,.04,z),project(x+.045,.04,z-4),project(x-.045,.04,z-4)],'#b5c4c9')}}
// Street scenery, approaching with travel
for(let z=105-(distance*.7)%18;z>-3;z-=18){for(let side of [-1,1]){let x=side*7.3;box(x,0,z,2.7,5.8+(Math.sin(z*7)*2),4.5,side===-1?'#6989a4':'#8b94ae','#4a647c','#a9b6c7');box(side*5.3,0,z, .16,3.6,.16,'#d2dfe6','#96aaba','#effaff');sphere(side*5.3,3.65,z,.27,'#ffe4a2','#fff9d3')}}
let ordered=[...objects].sort((a,b)=>b.z-a.z);for(let o of ordered){if(o.z>-.5&&o.z<100){if(o.kind==='enemy')zombie(o);else gate(o)}}
if(active){let count=Math.min(soldiers,36);for(let i=count-1;i>=0;i--){let col=i%6,row=Math.floor(i/6),x=playerX+(col-2.5)*.37,z=5+row*.7;soldier(x,z,i*.9,.83)}if(soldiers>36){let p=project(playerX,2.4,2);g.fillStyle='#fff';g.font='bold 20px system-ui';g.textAlign='center';g.fillText('×'+soldiers,p.x,p.y)}}
for(let s of shots){let a=project(s.x,1.2,s.z),b=project(s.tx,1.5,s.tz);g.save();g.globalAlpha=clamp(s.life/.13,0,1);line(a,b,'#ffe975',3);ellipse(a.x,a.y,7,7,'#fff2b2');g.restore()}for(let f of fx){let p=project(f.x,f.y,f.z);g.globalAlpha=clamp(f.life*2,0,1);ellipse(p.x,p.y,Math.max(2,p.k*.07),Math.max(2,p.k*.07),f.color)}g.globalAlpha=1;
if(active){g.fillStyle='#102a44aa';g.fillRect(12,H-39,W-24,8);g.fillStyle='#6effcc';let progress=clamp(1-(nextCP-distance)/370,0,1);g.fillRect(12,H-39,(W-24)*progress,8);g.fillStyle='#fff';g.textAlign='center';g.font='bold 12px system-ui';g.fillText('💾 Nächster Checkpoint in '+Math.ceil(Math.max(0,nextCP-distance))+' m',W/2,H-49)}}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function pointer(e){let rect=canvas.getBoundingClientRect();dragX=clamp(((e.clientX-rect.left)/rect.width-.5)*9,-3.4,3.4)}canvas.addEventListener('pointerdown',e=>{drag=true;pointer(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag)pointer(e)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
</script></body></html>
